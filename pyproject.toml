[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "service-operations-analytics"
version = "0.1.0"
description = "Reliable incident analytics from historical service-management events"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "pyarrow>=18,<26"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "cfn-lint>=1,<2"]
aws = ["boto3[crt]>=1.42,<2"]
ml = ["scikit-learn>=1.6,<2"]

[project.scripts]
serviceops = "serviceops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
