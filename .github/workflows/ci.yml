name: Validate project
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install '.[dev,aws,ml]'
      - run: python -m ruff check src tests scripts aws
      - run: python -m pytest
      - run: cfn-lint infrastructure/*.yaml
