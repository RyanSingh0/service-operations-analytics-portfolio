name: Validate and deploy forecast
on:
  push:
    branches: [main]
    paths:
      - 'src/serviceforecast/**'
      - 'aws/forecast_job.py'
      - 'dashboard/forecast/**'
      - 'scripts/release_forecast.py'
      - '.github/workflows/forecast.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: serviceops-forecast
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,aws,ml]'
      - run: python -m pytest
      - run: python -m ruff check src tests scripts aws
      - run: cfn-lint infrastructure/*.yaml
  deploy:
    needs: validate
    if: vars.ENABLE_FORECAST_RELEASE == 'true' && vars.AWS_DEPLOY_ROLE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[aws]'
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: us-east-1
      - name: Publish forecast and verify data
        run: python scripts/release_forecast.py
        env:
          DataBucket: ${{ vars.DATA_BUCKET }}
          WebBucket: ${{ vars.WEB_BUCKET }}
