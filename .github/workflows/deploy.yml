name: Validate and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: serviceops-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install '.[dev,aws]'
      - run: python -m ruff check src tests scripts aws
      - run: python -m pytest
      - run: cfn-lint infrastructure/*.yaml
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[aws]'
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: us-east-1
      - name: Release application and verify workflow
        run: python scripts/release.py
        env:
          DataBucket: ${{ vars.DATA_BUCKET }}
          WebBucket: ${{ vars.WEB_BUCKET }}
          CoordinatorName: ${{ vars.COORDINATOR_NAME }}
          GlueJob: ${{ vars.GLUE_JOB }}
          RunTable: ${{ vars.RUN_TABLE }}
          WorkflowArn: ${{ vars.WORKFLOW_ARN }}
