AWSTemplateFormatVersion: '2010-09-09'
Description: Aggregate dashboard page views without visitor identifiers
Parameters:
  DataBucket: {Type: String}
  CodeKey: {Type: String}
  WebsiteOrigin: {Type: String}
Resources:
  Counts:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: day, AttributeType: S}]
      KeySchema: [{AttributeName: day, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: expires, Enabled: true}
      SSESpecification: {SSEEnabled: true}
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AggregatePageViewsOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt Counts.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/serviceops-demo-page-views:*'
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/serviceops-demo-page-views
      RetentionInDays: 7
  Function:
    Type: AWS::Lambda::Function
    DependsOn: Logs
    Properties:
      FunctionName: serviceops-demo-page-views
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt Role.Arn
      MemorySize: 128
      Timeout: 5
      Code: {S3Bucket: !Ref DataBucket, S3Key: !Ref CodeKey}
      Environment:
        Variables:
          USAGE_TABLE: !Ref Counts
          WEBSITE_ORIGIN: !Ref WebsiteOrigin
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: serviceops-demo-page-views
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref WebsiteOrigin]
        AllowMethods: [POST]
        AllowHeaders: [content-type]
        MaxAge: 86400
  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: '2.0'
  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: POST /view
      Target: !Sub 'integrations/${Integration}'
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: 1
        ThrottlingBurstLimit: 2
  Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/POST/view'
Outputs:
  UsageTable: {Value: !Ref Counts}
  UsageEndpoint: {Value: !Sub '${Api.ApiEndpoint}/view'}
  UsageOrigin: {Value: !GetAtt Api.ApiEndpoint}
